<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12304a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Computing Adventure">
<title>Computing Adventure</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#12304a;--blue:#2f7de1;--mint:#12b58c;--coral:#f2645a;--sun:#f5b83d;--cream:#f3f8fb;--text:#1f2f3d;--muted:#64788a;--line:#dbe6ee;--white:#fff;--r:20px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--c:#2f7de1}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:'Baloo 2','Nunito',sans-serif;color:var(--navy);line-height:1.15}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:1rem}
a{color:var(--blue)}
#app{max-width:820px;margin:0 auto;padding:0 16px calc(96px + var(--sab));min-height:100dvh}
.hide{display:none!important}
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(var(--sat) + 10px) 16px 10px;background:rgba(243,248,251,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.topbar h2{font-size:1.2rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1.25rem;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:scale(.94)}
.starpill{background:var(--navy);color:var(--sun);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.95rem;white-space:nowrap}
.hero{margin:0 -16px;padding:calc(var(--sat) + 14px) 16px 58px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#12304a 0%,#1d5a8c 60%,#2f7de1 100%)}
.hero .traces{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.hero .row{position:relative;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;position:relative}
.brand .logo{width:46px;height:46px;border-radius:14px;background:#f5b83d;display:grid;place-items:center;font-size:1.7rem;box-shadow:0 0 0 4px rgba(245,184,61,.3)}
.brand h1{color:#fff;font-size:1.5rem;font-weight:800}
.brand small{display:block;font-size:.78rem;opacity:.85;font-weight:600;margin-top:-2px}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px 6px 8px;color:#fff;font-weight:800}
.who .av{font-size:1.5rem}
.hello{position:relative;margin-top:16px;font-family:'Baloo 2';font-weight:800;font-size:1.45rem}
.hello span{display:block;font-family:'Nunito';font-weight:600;font-size:.95rem;opacity:.9;margin-top:2px}
.spark{position:absolute;right:-10px;top:-26px;font-size:7rem;opacity:.13;transform:rotate(14deg);pointer-events:none}
.card{background:#fff;border-radius:var(--r);box-shadow:0 4px 16px rgba(18,48,74,.09);padding:16px;margin:14px 0}
.card.flat{box-shadow:none;border:2px solid var(--line)}
.card.warm{background:#fff8e6;border:2px solid #f5d98a;box-shadow:none}
.card.calm{background:#eefaf5;border:2px solid #bfe9d9;box-shadow:none}
.sec{margin:24px 0 8px;font-size:1.15rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center}.mono{font-family:'Fira Code',ui-monospace,monospace}
.btn{border:none;border-radius:16px;padding:13px 20px;font-weight:800;font-size:1rem;background:var(--blue);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.mint{background:var(--mint);color:#053b2f}.btn.coral{background:var(--coral)}.btn.sun{background:var(--sun);color:#4a3600}.btn.navy{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:none}
.btn.wide{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{font-size:1.2rem;padding:18px 24px;border-radius:20px;min-height:62px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.9rem;border-radius:12px}
.say{border:2px solid var(--line);background:#fff;border-radius:999px;width:34px;height:34px;font-size:1rem;vertical-align:middle}
.row{display:flex;gap:10px;align-items:center}.wrapx{display:flex;flex-wrap:wrap;gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e5f0fc;color:var(--navy);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem;border:none}
.chip.on{background:var(--navy);color:#fff}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue)}
label.lbl{display:block;font-weight:800;margin:12px 0 6px;color:var(--navy)}
.feedback{margin-top:10px;font-weight:700;min-height:1.2em}.feedback.good{color:#0b8a67}.feedback.bad{color:#c2412f}
.bar{height:10px;border-radius:99px;background:#e3edf4;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.bigem{font-size:3.2rem;line-height:1.1;text-align:center}
.stars span{font-size:1.1rem}.stars span.off{filter:grayscale(1);opacity:.3}
/* home */
.arcade{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 4px;text-align:left;border:none;border-radius:20px;padding:14px 16px;background:linear-gradient(135deg,#f2645a,#d94a5a);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);font:inherit}
.arcade .em{font-size:2.2rem}.arcade .tx{display:flex;flex-direction:column}.arcade .tx b{font-family:'Baloo 2',sans-serif;font-size:1.2rem}.arcade .tx span{font-size:.85rem;opacity:.95}
.oopscard{display:flex;align-items:center;gap:12px;width:100%;margin:-34px 0 0;position:relative;text-align:left;border:none;border-radius:20px;padding:14px 16px;background:#fff;box-shadow:0 6px 18px rgba(18,48,74,.16);font:inherit;border-left:8px solid var(--sun)}
.oopscard .em{font-size:2rem}.oopscard small{color:var(--muted);font-weight:800;letter-spacing:.06em;font-size:.7rem}
.oopscard b{display:block;font-family:'Baloo 2';font-size:1.1rem;color:var(--navy)}
.quest{display:flex;flex-direction:column;gap:12px}
.node{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:none;border-radius:20px;padding:14px;box-shadow:0 4px 14px rgba(18,48,74,.09);border-left:8px solid var(--c)}
.node .em{font-size:2.3rem;width:56px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--c) 16%,white);display:grid;place-items:center;flex:none}
.node .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.node .tx b{font-family:'Baloo 2';font-size:1.15rem;color:var(--navy)}
.node .tx .un{font-size:.7rem;font-weight:800;letter-spacing:.08em;color:var(--c)}.node .tx span{font-size:.85rem;color:var(--muted)}
.node .bd{font-size:1.8rem;opacity:.25;filter:grayscale(1)}.node.got .bd{opacity:1;filter:none}
.nextpill{position:absolute;top:-8px;right:12px;background:var(--sun);color:#4a3600;font-weight:800;font-size:.7rem;border-radius:99px;padding:3px 10px}
.labcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 0;font:inherit}
.labcard .em{font-size:1.9rem;width:44px;text-align:center;flex:none}.labcard b{color:var(--navy)}.labcard .d{display:block;font-size:.85rem;color:var(--muted)}
.labcard.locked{opacity:.55}
.uhero{margin:0 -16px;padding:calc(var(--sat) + 12px) 16px 18px;color:#fff;background:linear-gradient(150deg,var(--c),#12304a)}
.uhero h1{color:#fff;font-size:1.7rem}.uhero .em{font-size:3rem}
.uhero .bq{margin-top:12px;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 14px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab)}
.nav>div{max-width:820px;margin:0 auto;display:flex}
.nav button{flex:1;border:none;background:none;padding:8px 2px 8px;font-weight:800;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button .e{font-size:1.35rem}.nav button.on{color:var(--blue)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.avgrid button{font-size:1.8rem;border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px}.avgrid button.on{border-color:var(--blue);background:#e5f0fc}
.bands{display:flex;flex-direction:column;gap:8px}
.bands button{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}.bands button.on{border-color:var(--blue);background:#e5f0fc}.bands .e{font-size:1.7rem}
.nbitem{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;margin:8px 0;text-align:left}
.modal{position:fixed;inset:0;z-index:100;background:rgba(18,48,74,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal .box{background:#fff;border-radius:24px;padding:22px;max-width:480px;width:100%;text-align:center;max-height:92dvh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:120}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:130;animation:fall 3s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
table.plain{width:100%;border-collapse:collapse;font-size:.9rem}table.plain th,table.plain td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.mission{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ck{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:#fff;flex:none;font-weight:800;color:#fff}.ck.on{background:var(--mint);border-color:var(--mint)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800}.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* typing */
.tbox{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;font-family:'Fira Code',ui-monospace,monospace;font-size:1.45rem;line-height:2.1;letter-spacing:.02em;word-break:break-word;white-space:pre-wrap;min-height:120px}
.tbox.big{font-size:2.6rem;text-align:center;line-height:1.5}
.tbox .ok{color:#0b8a67}.tbox .cur{background:#fde9a8;border-radius:5px;box-shadow:0 2px 0 #f5b83d}.tbox .no{background:#ffd9d4;border-radius:5px}
.tbox.shake{animation:shk .25s}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.kbd{margin:12px auto 0;user-select:none;max-width:760px}
.krow{display:flex;gap:4px;margin-bottom:4px}
.key{flex:1 1 0;min-width:0;height:42px;border-radius:8px;border:2px solid rgba(0,0,0,.12);background:var(--kc,#eef3f7);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:#1f2f3d;position:relative;font-family:'Nunito'}
.key small{position:absolute;top:1px;left:4px;font-size:.55rem;opacity:.6}
.key.w15{flex:1.5}.key.w2{flex:2}.key.w25{flex:2.5}.key.w6{flex:7}.key.dim{opacity:.35}
.key.bump::after{content:"";position:absolute;bottom:4px;width:12px;height:3px;border-radius:2px;background:rgba(0,0,0,.45)}
.key.hit{outline:4px solid var(--navy);background:#fff176;transform:scale(1.07);z-index:2;animation:pulse .9s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(245,184,61,.5)}}
.kbd.hidden .key{--kc:#eef3f7!important;color:transparent}.kbd.hidden .key.hit{outline:none;background:#eef3f7;transform:none;animation:none}
.finger{margin-top:8px;font-weight:800;text-align:center;min-height:1.4em}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;font-size:.72rem;font-weight:800}.legend span{padding:3px 8px;border-radius:99px}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;font-family:'Baloo 2';font-size:1.5rem;color:var(--navy)}
/* mouse + games stage */
.stage{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;height:360px;overflow:hidden;touch-action:none;user-select:none}
.stage.scroll{touch-action:pan-y}
.tgt{position:absolute;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--sun);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.tgt.glow{animation:pulse .9s infinite}
.drag{position:absolute;font-size:2rem;padding:6px;cursor:grab;touch-action:none;z-index:3}
.bucket{position:absolute;bottom:10px;width:30%;height:90px;border:3px dashed var(--c);border-radius:16px;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.7)}
.ctxmenu{position:absolute;z-index:9;background:#fff;border:2px solid var(--line);border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.18);padding:4px;min-width:150px}
.ctxmenu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 12px;border-radius:8px;font-weight:700}.ctxmenu button:hover{background:#e5f0fc}
/* desktop sim */
.desk{position:relative;height:520px;border-radius:18px;overflow:hidden;border:3px solid var(--navy);background:linear-gradient(135deg,#6ab7ff,#2f7de1 50%,#7b5cd6);user-select:none;touch-action:none}
.desk.dark{background:linear-gradient(135deg,#1b2a41,#324a5f 60%,#0c1821)}
.desk .dicon{position:absolute;width:74px;text-align:center;color:#fff;font-size:.72rem;font-weight:700;border:2px solid transparent;border-radius:10px;padding:4px;background:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.desk .dicon .i{font-size:2rem;display:block}.desk .dicon.sel{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.7)}
.tb{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(18,48,74,.92);display:flex;align-items:center;gap:6px;padding:0 6px;z-index:50}
.tb button{border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;height:34px;padding:0 10px;font-weight:700;font-size:.8rem;white-space:nowrap}
.tb button.start{background:var(--mint);color:#053b2f;font-size:1rem}.tb button.on{background:rgba(255,255,255,.35)}
.tb .clk{margin-left:auto;color:#fff;font-weight:700;font-size:.8rem;padding-right:6px}
.startmenu{position:absolute;left:6px;bottom:50px;width:230px;background:#fff;border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:60}
.startmenu button{display:flex;gap:10px;align-items:center;width:100%;border:none;background:none;padding:9px 10px;border-radius:10px;font-weight:700;text-align:left}.startmenu button:hover{background:#e5f0fc}
.win{position:absolute;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.35);border:1px solid #9fb4c4;display:flex;flex-direction:column;overflow:hidden;min-width:200px}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 44px)!important;border-radius:0}
.win .tbar{background:#e6eff6;display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:move;font-weight:800;font-size:.85rem;touch-action:none}
.win .tbar span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .tbar button{width:28px;height:26px;border:none;border-radius:6px;background:#fff;font-weight:800}.win .tbar button.x:hover{background:#f2645a;color:#fff}
.win .body{flex:1;overflow:auto;padding:8px;font-size:.85rem}.win.front{box-shadow:0 10px 34px rgba(0,0,0,.5)}
.fileitem{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:6px;border-radius:8px;border:2px solid transparent;font-size:.72rem;font-weight:700;text-align:center;background:none;vertical-align:top;word-break:break-word}.fileitem .i{font-size:1.8rem}.fileitem.sel{background:#cfe4fb;border-color:var(--blue)}
.qpanel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 12px}
.qstep{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-weight:700}.qstep .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.75rem;color:#fff}.qstep.done .b{background:var(--mint);border-color:var(--mint)}.qstep.done{color:var(--muted);text-decoration:line-through}.qstep.now{color:var(--navy)}.qstep.now .b{border-color:var(--blue)}
.hintbox{background:#fff8e6;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.9rem;margin-top:8px}
/* scenes */
.mock{background:#f7fafc;border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.bubble{max-width:82%;padding:9px 13px;border-radius:16px;margin:6px 0;font-weight:600;background:#e8eef5;position:relative}.bubble.me{background:#d6ecff;margin-left:auto}
.bubble .nm{display:block;font-size:.7rem;font-weight:800;color:var(--muted)}
.urlbar{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:700;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;font-weight:700}.opt:active{transform:scale(.99)}
.opt.good{border-color:var(--mint);background:#e8f8f2}.opt.try{border-color:var(--sun);background:#fff8e6}
.why{margin-top:10px;border-radius:14px;padding:10px 14px;font-weight:600}.why.good{background:#e8f8f2}.why.try{background:#fff8e6}
.hot{border-bottom:3px dotted var(--coral);cursor:pointer}.hot.found{background:#ffd9d4;border-radius:4px}
.sortcard{display:inline-block;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;margin:5px;font-weight:700}.sortcard.sel{border-color:var(--blue);background:#e5f0fc}
.bk{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:90px;flex:1}.bk h4{font-size:1rem;margin-bottom:4px}
.meter{height:14px;border-radius:99px;background:#e3edf4;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--coral);transition:all .3s}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700}
.toggle input{width:22px;height:22px}
.postcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}.postcard .who2{font-weight:800;color:var(--navy)}
@media print{.nav,.topbar,.noprint{display:none!important}body{background:#fff}#app{padding:0}.card{box-shadow:none;border:2px solid #000}.btn{display:none}}
@media (max-width:520px){.key{height:36px;font-size:.72rem}.tbox{font-size:1.15rem}.desk{height:460px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"></div>
<input id="softkb" aria-hidden="true" tabindex="-1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="position:fixed;opacity:0;pointer-events:none;left:-100px;top:0;width:10px;height:10px">
<script src="ca-core.js"></script>
<script src="ca-keys.js"></script>
<script src="ca-mouse.js"></script>
<script src="ca-sim.js"></script>
